services:
  postgres:
    image: postgres:16
    container_name: cricchat-postgres
    environment:
      POSTGRES_USER: cricchat
      POSTGRES_PASSWORD: cricchat
      POSTGRES_DB: cricchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro

volumes:
  pgdata:
